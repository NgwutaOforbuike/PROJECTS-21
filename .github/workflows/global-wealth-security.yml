name: Global Wealth OS Security

on:
  push:
    branches: [global-wealth-trading-os]
  pull_request:
    branches: [global-wealth-trading-os]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-and-dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject obvious committed secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          patterns = [
              re.compile(r"BEGIN (?:RSA|EC|OPENSSH) PRIVATE KEY"),
              re.compile(r"\bsk-[A-Za-z0-9_-]{20,}\b"),
              re.compile(r"(?i)\b(?:api[_-]?key|password|secret|token)\s*=\s*['\"][^$'{][^'\"]{7,}['\"]"),
          ]
          ignored_suffixes = {".md", ".example"}
          ignored_parts = {".git", "node_modules", "__pycache__", "dist", ".venv"}
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in ignored_parts for part in path.parts):
                  continue
              if path.suffix in ignored_suffixes or path.name.endswith(".env.example"):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if any(p.search(line) for p in patterns):
                      hits.append(f"{path}:{lineno}")
          if hits:
              print("Potential committed secrets detected:")
              print("\n".join(hits))
              sys.exit(1)
          print("No obvious committed secrets detected.")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit API dependencies
        working-directory: global-wealth-trading-os
        run: |
          npm install
          npm audit --audit-level=high

      - name: Audit Web dependencies
        working-directory: global-wealth-trading-os/web
        run: |
          npm install
          npm audit --audit-level=high

      - name: Audit Python dependencies
        working-directory: global-wealth-trading-os/python_ai
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e .
          pip install pip-audit
          pip-audit
