name: SEC 10000 Source Ingestion

on:
  push:
    paths:
      - ".github/workflows/sec-10000-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Prepare workspace
        run: |
          mkdir -p hf_repo sec_all sec_selected artifacts

      - name: Install Hugging Face client
        run: |
          python -m pip install --quiet --disable-pip-version-check huggingface_hub

      - name: Download SEC-derived full 10-K archives
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="astr010/sec-10k-markdown-compressed",
              repo_type="dataset",
              local_dir="hf_repo",
              allow_patterns=["*_filings.tar.gz"],
          )
          PY

      - name: Extract all filing archives
        shell: bash
        run: |
          find hf_repo -type f -name '*_filings.tar.gz' -print0 | while IFS= read -r -d '' a; do
            tar -xzf "$a" -C sec_all
          done
          TOTAL=$(find sec_all -type f -name '10-K_*.md' | wc -l)
          echo "Full filings available: $TOTAL"
          test "$TOTAL" -ge 10000

      - name: Select 10000 complete filings
        shell: bash
        run: |
          find sec_all -type f -name '10-K_*.md' -printf '%s %p\n'             | sort -n             | head -n 10000             | cut -d' ' -f2- > selected_files.txt

          COUNT=$(wc -l < selected_files.txt)
          echo "Selected complete filings: $COUNT"
          test "$COUNT" -eq 10000

          while IFS= read -r f; do
            rel="${f#sec_all/}"
            mkdir -p "sec_selected/$(dirname "$rel")"
            cp "$f" "sec_selected/$rel"
          done < selected_files.txt

      - name: Build acquisition and integrity manifests
        shell: bash
        run: |
          cd sec_selected
          find . -type f -name '10-K_*.md' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          COUNT=$(find . -type f -name '10-K_*.md' | wc -l)
          {
            echo "source_dataset=astr010/sec-10k-markdown-compressed"
            echo "source_dataset_url=https://huggingface.co/datasets/astr010/sec-10k-markdown-compressed"
            echo "underlying_source=U.S. Securities and Exchange Commission EDGAR"
            echo "document_type=SEC Form 10-K full-length Markdown"
            echo "acquired_documents=$COUNT"
            echo "selection=10000 smallest complete filings by byte size from 12361-document corpus"
            echo "acquisition_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "dataset_license=MIT"
            echo "underlying_SEC_filings=US Government public records"
          } > ACQUISITION_MANIFEST.txt
          test "$COUNT" -eq 10000

      - name: Package verified corpus
        run: |
          tar -czf artifacts/sec_edgar_10000_full_10k_documents.tar.gz -C sec_selected .
          ls -lh artifacts/sec_edgar_10000_full_10k_documents.tar.gz
          sha256sum artifacts/sec_edgar_10000_full_10k_documents.tar.gz > artifacts/PACKAGE_SHA256.txt

      - name: Upload verified corpus artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-edgar-10000-full-10k-documents
          path: |
            artifacts/sec_edgar_10000_full_10k_documents.tar.gz
            artifacts/PACKAGE_SHA256.txt
          retention-days: 1
          compression-level: 0
