name: NGX Filing Discovery

on:
  push:
    branches: [ngx-filings-archive]
    paths:
      - "ngx_archive/**"
      - ".github/workflows/ngx-filing-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ngx-filings-archive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Discover NGX/NSE filing documents
        run: python ngx_archive/discover_ngx_filings.py
      - uses: actions/upload-artifact@v4
        with:
          name: ngx-filing-discovery
          path: |
            ngx_manifest.csv
            ngx_urls.txt
            ngx_discovery_summary.txt
          retention-days: 7
