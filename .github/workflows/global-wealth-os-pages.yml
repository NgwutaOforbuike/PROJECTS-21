name: Global Wealth OS Visual Build

on:
  push:
    branches: [global-wealth-trading-os]
    paths:
      - "global-wealth-trading-os/web/**"
      - ".github/workflows/global-wealth-os-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-wealth-os-visual-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: global-wealth-trading-os/web
        run: npm install
      - name: Build exact frontend from GitHub commit
        working-directory: global-wealth-trading-os/web
        run: npm run build
      - name: Add commit metadata
        run: |
          cat > global-wealth-trading-os/web/dist/build-meta.json <<EOF
          {"commit":"$GITHUB_SHA","branch":"$GITHUB_REF_NAME","workflow_run":"$GITHUB_RUN_ID"}
          EOF
      - name: Upload built visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: global-wealth-os-web-${{ github.sha }}
          path: global-wealth-trading-os/web/dist
