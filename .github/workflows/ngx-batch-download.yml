name: NGX Batch Download

on:
  push:
    branches:
      - ngx-filings-archive
    paths:
      - 'ngx_archive/batch_*_urls.txt'
      - '.github/workflows/ngx-batch-download.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ngx-filings-archive
      - name: Download latest filing batch
        shell: bash
        run: |
          set -u
          batchfile=$(ls ngx_archive/batch_*_urls.txt | sort | tail -n 1)
          batchname=$(basename "$batchfile" _urls.txt)
          echo "Processing $batchfile"
          mkdir -p downloaded
          echo 'url,status,http_code,bytes,filename' > download_status.csv
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            fname=$(python -c "import sys,urllib.parse,os; p=urllib.parse.urlparse(sys.argv[1]).path; print(os.path.basename(urllib.parse.unquote(p)) or 'document.pdf')" "$url")
            safe=$(printf '%s' "$fname" | tr '/\\:*?<>|' '_')
            code=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 180 -A 'Mozilla/5.0' -o "downloaded/$safe" -w '%{http_code}' -sS "$url" || true)
            if [ -s "downloaded/$safe" ] && [ "$code" = "200" ]; then
              bytes=$(wc -c < "downloaded/$safe" | tr -d ' ')
              printf '"%s",downloaded,"%s","%s","%s"\n' "$url" "$code" "$bytes" "$safe" >> download_status.csv
            else
              rm -f "downloaded/$safe"
              printf '"%s",blocked_or_failed,"%s",0,"%s"\n' "$url" "$code" "$safe" >> download_status.csv
            fi
          done < "$batchfile"
          cp "$batchfile" processed_urls.txt
          printf '%s\n' "$batchname" > batch_name.txt
          cat download_status.csv
      - uses: actions/upload-artifact@v4
        with:
          name: ngx-latest-batch-downloads
          path: |
            downloaded/
            download_status.csv
            processed_urls.txt
            batch_name.txt
          retention-days: 7
