name: Global Wealth OS CI
on:
  push:
    branches: [global-wealth-trading-os]
    paths:
      - 'global-wealth-trading-os/**'
      - '.github/workflows/global-wealth-os-ci.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build API
        working-directory: global-wealth-trading-os
        run: |
          npm install
          npm run build
      - name: Build Web
        working-directory: global-wealth-trading-os/web
        run: |
          npm install
          npm run build
