name: Quant Finance Research Ingestion

on:
  push:
    paths:
      - ".github/workflows/quant-arxiv-ingest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare workspace
        run: |
          mkdir -p corpus artifacts metadata

      - name: Discover 200 quantitative-finance papers from arXiv
        run: |
          python - <<'PY'
          import urllib.parse, urllib.request, xml.etree.ElementTree as ET, json
          q='cat:q-fin.TR OR cat:q-fin.PM OR cat:q-fin.RM OR cat:q-fin.CP OR cat:q-fin.ST OR cat:q-fin.EC'
          url='https://export.arxiv.org/api/query?' + urllib.parse.urlencode({
              'search_query': q,
              'start': 0,
              'max_results': 200,
              'sortBy': 'submittedDate',
              'sortOrder': 'descending'
          })
          req=urllib.request.Request(url,headers={'User-Agent':'GlobalWealthAI/1.0 research corpus'})
          with urllib.request.urlopen(req, timeout=45) as r:
              data=r.read()
          root=ET.fromstring(data)
          ns={'a':'http://www.w3.org/2005/Atom'}
          papers=[]
          for e in root.findall('a:entry',ns):
              abs_url=e.findtext('a:id',default='',namespaces=ns)
              arxiv_id=abs_url.rsplit('/',1)[-1]
              papers.append({
                  'arxiv_id': arxiv_id,
                  'title':' '.join((e.findtext('a:title',default='',namespaces=ns) or '').split()),
                  'published':e.findtext('a:published',default='',namespaces=ns),
                  'updated':e.findtext('a:updated',default='',namespaces=ns),
                  'authors':[a.findtext('a:name',default='',namespaces=ns) for a in e.findall('a:author',ns)],
                  'abstract':' '.join((e.findtext('a:summary',default='',namespaces=ns) or '').split()),
                  'source_url':abs_url,
                  'pdf_url':f'https://arxiv.org/pdf/{arxiv_id}.pdf'
              })
          assert len(papers)==200, f'Expected 200 papers, got {len(papers)}'
          with open('metadata/arxiv_quant_200.json','w',encoding='utf-8') as f: json.dump(papers,f,ensure_ascii=False,indent=2)
          print('Discovered papers:',len(papers))
          PY

      - name: Download and validate PDFs
        run: |
          python - <<'PY'
          import json, pathlib, urllib.request, time, hashlib
          papers=json.load(open('metadata/arxiv_quant_200.json',encoding='utf-8'))
          root=pathlib.Path('corpus'); root.mkdir(exist_ok=True)
          hashes=[]; failures=[]
          for i,p in enumerate(papers,1):
              safe=p['arxiv_id'].replace('/','_')
              out=root/f'{i:03d}_{safe}.pdf'
              ok=False
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(p['pdf_url'],headers={'User-Agent':'GlobalWealthAI/1.0 research corpus'})
                      with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
                      if not data.startswith(b'%PDF') or len(data)<10000: raise ValueError('not a valid PDF payload')
                      out.write_bytes(data)
                      h=hashlib.sha256(data).hexdigest()
                      hashes.append(f'{h}  {out.name}')
                      ok=True
                      break
                  except Exception as e:
                      if attempt==2: failures.append((p['arxiv_id'],str(e)))
                      time.sleep(2+attempt)
              if not ok: continue
              if i%25==0: print('Downloaded',i)
              time.sleep(0.15)
          pathlib.Path('artifacts/SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n',encoding='utf-8')
          pathlib.Path('artifacts/FAILURES.txt').write_text('\n'.join(f'{a}\t{e}' for a,e in failures),encoding='utf-8')
          count=len(list(root.glob('*.pdf')))
          print('Validated PDFs:',count,'Failures:',len(failures))
          assert count>=180, f'Too few validated papers: {count}'
          PY

      - name: Build manifest and four Drive-safe bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, datetime, json
          files=sorted(Path('corpus').glob('*.pdf'))
          manifest=[
              'corpus=Quantitative finance open research tranche 1',
              'source=arXiv',
              'categories=q-fin.TR,q-fin.PM,q-fin.RM,q-fin.CP,q-fin.ST,q-fin.EC',
              f'validated_documents={len(files)}',
              'selection=200 most recent papers returned by arXiv API at acquisition time',
              f'acquisition_utc={datetime.datetime.now(datetime.timezone.utc).isoformat()}',
              'usage=research corpus; retain arXiv metadata and source URLs'
          ]
          Path('artifacts/ACQUISITION_MANIFEST.txt').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
          chunks=[files[i:i+50] for i in range(0,len(files),50)]
          for idx,chunk in enumerate(chunks,1):
              out=Path('artifacts')/f'quant-arxiv-tranche-01-bundle-{idx:02d}.zip'
              with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
                  for p in chunk: z.write(p,p.name)
                  z.write('metadata/arxiv_quant_200.json','arxiv_quant_200.json')
                  z.write('artifacts/ACQUISITION_MANIFEST.txt','ACQUISITION_MANIFEST.txt')
                  z.write('artifacts/SHA256SUMS.txt','SHA256SUMS.txt')
              print(out.name, len(chunk), out.stat().st_size)
              assert out.stat().st_size < 95_000_000
          PY

      - name: Upload bundle 1
        uses: actions/upload-artifact@v4
        with:
          name: quant-arxiv-tranche-01-bundle-01
          path: artifacts/quant-arxiv-tranche-01-bundle-01.zip
          retention-days: 1
          compression-level: 0

      - name: Upload bundle 2
        uses: actions/upload-artifact@v4
        with:
          name: quant-arxiv-tranche-01-bundle-02
          path: artifacts/quant-arxiv-tranche-01-bundle-02.zip
          retention-days: 1
          compression-level: 0

      - name: Upload bundle 3
        uses: actions/upload-artifact@v4
        with:
          name: quant-arxiv-tranche-01-bundle-03
          path: artifacts/quant-arxiv-tranche-01-bundle-03.zip
          retention-days: 1
          compression-level: 0

      - name: Upload bundle 4
        uses: actions/upload-artifact@v4
        with:
          name: quant-arxiv-tranche-01-bundle-04
          path: artifacts/quant-arxiv-tranche-01-bundle-04.zip
          retention-days: 1
          compression-level: 0
