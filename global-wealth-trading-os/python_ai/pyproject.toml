[project]
name = "global-wealth-ai"
version = "0.1.0"
description = "Autonomous research, knowledge and decision engine for Global Wealth & Trading OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "joblib>=1.4,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
